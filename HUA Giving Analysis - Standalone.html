document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

bfdc072d-af82-4506-9a56-035a26a742b9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f5ead8;\n  --color-surface: #ebddc5;\n  --color-text: #201e1d;\n  --color-accent: #c67139;\n  --color-accent-2: #7a8a5e;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<script src=\"b9d2c372-a3a4-4ed7-a5ca-4c5a1c1a8252\"><\u002Fscript>\n<style>\n:root{\n  --color-bg:#FBF5E9; --color-accent:#E4571E; --color-accent-2:#5F7C4C;\n  --hua-cream:#FBF5E9; --hua-cream-2:#F4E8D3; --hua-ink:#241C17; --hua-ink-2:#6E5D4F; --hua-ink-3:#9C8B79;\n  --hua-orange:#E4571E; --hua-gold:#F2A81D; --hua-red:#BE2E17; --hua-sage:#5F7C4C;\n  --hua-line:#E7D8BE; --hua-line-2:#F0E5D2; --hua-surface:#FFFFFF;\n}\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:var(--hua-cream);color:var(--hua-ink);font-family:'Figtree',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:\"tnum\" 1}\na{color:var(--hua-orange);text-decoration:none}\na:hover{color:var(--hua-red)}\n::selection{background:rgba(228,87,30,.18)}\ninput[type=range]{accent-color:#E4571E;width:100%}\ninput[type=text],input[type=search]{font-family:inherit}\nbutton{font-family:inherit}\n*{box-sizing:border-box}\n@keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:radial-gradient(1200px 520px at 78% -8%, rgba(242,168,29,.20), transparent 60%), radial-gradient(900px 460px at 6% 2%, rgba(228,87,30,.10), transparent 62%), var(--hua-cream)\">\n\n<header style=\"position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);background:rgba(251,245,233,.88);border-bottom:1px solid var(--hua-line)\">\n  <div style=\"max-width:1440px;min-width:1240px;margin:0 auto;padding:14px 40px;display:flex;align-items:center;gap:20px\">\n    <img src=\"6b4d6439-3f71-4211-9790-2e72b905459d\" alt=\"Hindu University of America seal\" style=\"width:52px;height:52px;flex:none\">\n    <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n      <div style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--hua-orange)\">Hindu University of America · Advancement<\u002Fdiv>\n      <div style=\"font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--hua-ink)\">Giving Analysis — FY 2024·25 vs FY 2025·26<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding-right:14px;border-right:1px solid var(--hua-line)\">\n        <div style=\"font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--hua-ink-3)\">Cohort<\u002Fdiv>\n        <div style=\"font-size:13px;font-weight:700;color:var(--hua-ink-2)\">75 donors · $500+ both years<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:1px\">\n        <div style=\"font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--hua-ink-3)\">FY26 total<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:800;color:var(--hua-orange)\">{{ t26f }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <nav style=\"max-width:1440px;min-width:1240px;margin:0 auto;padding:0 40px 10px;display:flex;gap:6px;flex-wrap:wrap\">\n    <a href=\"#overview\" style=\"font-size:12.5px;font-weight:700;color:var(--hua-ink-2);padding:6px 13px;border-radius:999px;border:1px solid transparent\" style-hover=\"background:rgba(228,87,30,.10);color:var(--hua-orange);border-color:rgba(228,87,30,.22)\">Overview<\u002Fa>\n    <a href=\"#bridge\" style=\"font-size:12.5px;font-weight:700;color:var(--hua-ink-2);padding:6px 13px;border-radius:999px;border:1px solid transparent\" style-hover=\"background:rgba(228,87,30,.10);color:var(--hua-orange);border-color:rgba(228,87,30,.22)\">Growth bridge<\u002Fa>\n    <a href=\"#concentration\" style=\"font-size:12.5px;font-weight:700;color:var(--hua-ink-2);padding:6px 13px;border-radius:999px;border:1px solid transparent\" style-hover=\"background:rgba(228,87,30,.10);color:var(--hua-orange);border-color:rgba(228,87,30,.22)\">Concentration<\u002Fa>\n    <a href=\"#circles\" style=\"font-size:12.5px;font-weight:700;color:var(--hua-ink-2);padding:6px 13px;border-radius:999px;border:1px solid transparent\" style-hover=\"background:rgba(228,87,30,.10);color:var(--hua-orange);border-color:rgba(228,87,30,.22)\">Circles<\u002Fa>\n    <a href=\"#midlevel\" style=\"font-size:12.5px;font-weight:700;color:var(--hua-ink-2);padding:6px 13px;border-radius:999px;border:1px solid transparent\" style-hover=\"background:rgba(228,87,30,.10);color:var(--hua-orange);border-color:rgba(228,87,30,.22)\">Mid-level<\u002Fa>\n    <a href=\"#downgrades\" style=\"font-size:12.5px;font-weight:700;color:var(--hua-ink-2);padding:6px 13px;border-radius:999px;border:1px solid transparent\" style-hover=\"background:rgba(228,87,30,.10);color:var(--hua-orange);border-color:rgba(228,87,30,.22)\">Downgrades<\u002Fa>\n    <a href=\"#hygiene\" style=\"font-size:12.5px;font-weight:700;color:var(--hua-ink-2);padding:6px 13px;border-radius:999px;border:1px solid transparent\" style-hover=\"background:rgba(228,87,30,.10);color:var(--hua-orange);border-color:rgba(228,87,30,.22)\">Data hygiene<\u002Fa>\n    <a href=\"#geography\" style=\"font-size:12.5px;font-weight:700;color:var(--hua-ink-2);padding:6px 13px;border-radius:999px;border:1px solid transparent\" style-hover=\"background:rgba(228,87,30,.10);color:var(--hua-orange);border-color:rgba(228,87,30,.22)\">Geography<\u002Fa>\n    <a href=\"#register\" style=\"font-size:12.5px;font-weight:700;color:var(--hua-ink-2);padding:6px 13px;border-radius:999px;border:1px solid transparent\" style-hover=\"background:rgba(228,87,30,.10);color:var(--hua-orange);border-color:rgba(228,87,30,.22)\">Donor register<\u002Fa>\n    <a href=\"#path\" style=\"font-size:12.5px;font-weight:700;color:var(--hua-ink-2);padding:6px 13px;border-radius:999px;border:1px solid transparent\" style-hover=\"background:rgba(228,87,30,.10);color:var(--hua-orange);border-color:rgba(228,87,30,.22)\">Path to $3.5M<\u002Fa>\n    <a href=\"#plan\" style=\"font-size:12.5px;font-weight:700;color:var(--hua-ink-2);padding:6px 13px;border-radius:999px;border:1px solid transparent\" style-hover=\"background:rgba(228,87,30,.10);color:var(--hua-orange);border-color:rgba(228,87,30,.22)\">Action plan<\u002Fa>\n  <\u002Fnav>\n<\u002Fheader>\n\n<main style=\"max-width:1440px;min-width:1240px;margin:0 auto;padding:44px 40px 120px;display:flex;flex-direction:column;gap:76px\">\n\n<section id=\"overview\" data-screen-label=\"Overview\" style=\"display:flex;flex-direction:column;gap:26px\">\n  <div style=\"display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:44px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:18px\">\n      <div style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--hua-orange)\">Executive summary<\u002Fdiv>\n      <h1 style=\"margin:0;font-family:'Caprasimo',Georgia,serif;font-weight:400;font-size:54px;line-height:1.04;letter-spacing:-.01em;color:var(--hua-ink);text-wrap:pretty\">Giving rose 44%. Almost none of it came from the base.<\u002Fh1>\n      <p style=\"margin:0;font-size:18px;line-height:1.62;color:var(--hua-ink-2);max-width:60ch;text-wrap:pretty\">Across the 75 donors who gave $500 or more in both fiscal years, receipts moved from $999,413 to $1,436,313. Strip out the ten largest gifts and the same cohort gave <strong style=\"color:var(--hua-red)\">10.7% less<\u002Fstrong> than the year before. The headline is a major-gift result; the pipeline underneath it contracted.<\u002Fp>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;padding-top:4px\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:8px 15px;border-radius:999px;background:rgba(95,124,76,.12);border:1px solid rgba(95,124,76,.26)\">\n          <span style=\"font-size:13px;font-weight:800;color:var(--hua-sage)\">33 donors up<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;padding:8px 15px;border-radius:999px;background:rgba(156,139,121,.12);border:1px solid rgba(156,139,121,.28)\">\n          <span style=\"font-size:13px;font-weight:800;color:var(--hua-ink-2)\">21 flat<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;padding:8px 15px;border-radius:999px;background:rgba(190,46,23,.10);border:1px solid rgba(190,46,23,.24)\">\n          <span style=\"font-size:13px;font-weight:800;color:var(--hua-red)\">21 down<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:20px;padding:28px 30px;box-shadow:0 1px 2px rgba(36,28,23,.04),0 18px 40px -24px rgba(36,28,23,.22);display:flex;flex-direction:column;gap:20px\">\n      <div style=\"font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--hua-ink-3)\">The four things to act on<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:start\">\n          <div style=\"width:34px;height:34px;border-radius:999px;background:var(--hua-orange);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800\">1<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px\">\n            <div style=\"font-size:15.5px;font-weight:800;color:var(--hua-ink)\">One donor is 26% of the year<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:var(--hua-ink-2)\">Saravanan Kasthuri moved $26,000 → $376,000. Without that single step-up, FY26 grew 6.1%, not 43.7%.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:start\">\n          <div style=\"width:34px;height:34px;border-radius:999px;background:var(--hua-orange);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800\">2<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px\">\n            <div style=\"font-size:15.5px;font-weight:800;color:var(--hua-ink)\">The mid-level tier is frozen<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:var(--hua-ink-2)\">Donors giving $1,000–$25,000 produced $306,925 in FY25 and $306,299 in FY26 — two more people, six hundred fewer dollars.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:start\">\n          <div style=\"width:34px;height:34px;border-radius:999px;background:var(--hua-orange);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800\">3<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px\">\n            <div style=\"font-size:15.5px;font-weight:800;color:var(--hua-ink)\">Circle data is clean<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:var(--hua-ink-2)\">Every recorded label now agrees with its own fiscal-year total, across both years. One item left: nine records still arrive blank from the CRM and are derived by threshold here rather than stored.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:start\">\n          <div style=\"width:34px;height:34px;border-radius:999px;background:var(--hua-orange);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800\">4<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px\">\n            <div style=\"font-size:15.5px;font-weight:800;color:var(--hua-ink)\">Both lead gifts were cut by $50,000<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:var(--hua-ink-2)\">Sajjan Agarwal and Braham Ratan Aggarwal each moved $250,000 → $200,000. That is $100,000 of annual capacity to win back.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px\">\n    <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:16px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:7px\">\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--hua-ink-3)\">FY 2024·25<\u002Fdiv>\n      <div style=\"font-size:27px;font-weight:800;letter-spacing:-.03em;color:var(--hua-ink)\">$999,413<\u002Fdiv>\n      <div style=\"font-size:12.5px;font-weight:600;color:var(--hua-ink-2)\">75 donors<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:16px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:7px\">\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--hua-ink-3)\">FY 2025·26<\u002Fdiv>\n      <div style=\"font-size:27px;font-weight:800;letter-spacing:-.03em;color:var(--hua-orange)\">$1,436,313<\u002Fdiv>\n      <div style=\"font-size:12.5px;font-weight:700;color:var(--hua-sage)\">+$436,901 · +43.7%<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:16px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:7px\">\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--hua-ink-3)\">Excl. top 10<\u002Fdiv>\n      <div style=\"font-size:27px;font-weight:800;letter-spacing:-.03em;color:var(--hua-ink)\">$289,313<\u002Fdiv>\n      <div style=\"font-size:12.5px;font-weight:700;color:var(--hua-red)\">−10.7% vs FY25<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:16px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:7px\">\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--hua-ink-3)\">Median gift<\u002Fdiv>\n      <div style=\"font-size:27px;font-weight:800;letter-spacing:-.03em;color:var(--hua-ink)\">$4,044<\u002Fdiv>\n      <div style=\"font-size:12.5px;font-weight:700;color:var(--hua-sage)\">from $3,000<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:16px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:7px\">\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--hua-ink-3)\">Top-10 share<\u002Fdiv>\n      <div style=\"font-size:27px;font-weight:800;letter-spacing:-.03em;color:var(--hua-ink)\">79.9%<\u002Fdiv>\n      <div style=\"font-size:12.5px;font-weight:700;color:var(--hua-red)\">from 72.9%<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:16px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:7px\">\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--hua-ink-3)\">Lifetime, this cohort<\u002Fdiv>\n      <div style=\"font-size:27px;font-weight:800;letter-spacing:-.03em;color:var(--hua-ink)\">$6.23M<\u002Fdiv>\n      <div style=\"font-size:12.5px;font-weight:600;color:var(--hua-ink-2)\">all-time receipts<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:12px;align-items:flex-start;padding:16px 20px;border-radius:14px;background:rgba(242,168,29,.13);border:1px solid rgba(242,168,29,.35)\">\n    <div style=\"font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#8A5A0B;padding-top:2px;flex:none\">Read this first<\u002Fdiv>\n    <p style=\"margin:0;font-size:14px;line-height:1.6;color:#5E4A2A\">This file contains only donors who gave <strong>$500 or more<\u002Fstrong>, and every one of them gave in both years. It therefore says nothing about acquisition, lapse, or sub-$500 giving — retention inside this cohort is 100% by construction. Treat every figure here as a statement about your <em>existing committed base<\u002Fem>, not about the whole donor file.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"bridge\" data-screen-label=\"Growth bridge\" style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:30px;flex-wrap:wrap\">\n    <div style=\"display:flex;flex-direction:column;gap:10px;max-width:64ch\">\n      <div style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--hua-orange)\">01 — Growth bridge<\u002Fdiv>\n      <h2 style=\"margin:0;font-family:'Caprasimo',Georgia,serif;font-weight:400;font-size:38px;line-height:1.1;letter-spacing:-.01em;color:var(--hua-ink)\">Where the $436,901 came from<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--hua-ink-2)\">Thirty-three donors increased their giving by $644,667 in total. Twenty-one reduced theirs by $207,765. One person accounts for more than half of everything gained.<\u002Fp>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ toggleExcl }}\" style=\
