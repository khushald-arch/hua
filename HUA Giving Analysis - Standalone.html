   <div style=\"display:flex;align-items:center;gap:11px;min-width:0\">\n          <div style=\"width:10px;height:10px;border-radius:999px;flex:none;background:{{ t.dot }}\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:1px;min-width:0\">\n            <div style=\"font-size:14.5px;font-weight:800;color:var(--hua-ink)\">{{ t.name }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;font-weight:600;color:var(--hua-ink-3)\">{{ t.range }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:right;font-size:13.5px;font-weight:600;color:var(--hua-ink-2)\">{{ t.a }}<\u002Fdiv>\n        <div style=\"text-align:right;font-size:13.5px;font-weight:600;color:var(--hua-ink-3)\">{{ t.an }}<\u002Fdiv>\n        <div style=\"text-align:right;font-size:13.5px;font-weight:800;color:var(--hua-ink)\">{{ t.b }}<\u002Fdiv>\n        <div style=\"text-align:right;font-size:13.5px;font-weight:600;color:var(--hua-ink-3)\">{{ t.bn }}<\u002Fdiv>\n        <div style=\"text-align:right;font-size:13px;font-weight:800;color:{{ t.dColor }}\">{{ t.d }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"padding-top:14px;font-size:13px;line-height:1.55;color:var(--hua-ink-2)\">{{ tierNote }}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px\">\n    <div style=\"background:rgba(95,124,76,.10);border:1px solid rgba(95,124,76,.28);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:5px\">\n      <div style=\"font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--hua-sage)\">21 up<\u002Fdiv>\n      <div style=\"font-size:13.5px;line-height:1.5;color:#41562F\">Climbed at least one circle. Seven crossed into Sushruta Patron ($50,000+) — the strongest signal in the file.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--hua-cream-2);border:1px solid var(--hua-line);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:5px\">\n      <div style=\"font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--hua-ink-2)\">40 held<\u002Fdiv>\n      <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">Same circle both years. Twenty-one gave the identical amount — a renewal habit with no ask attached to it.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:rgba(190,46,23,.08);border:1px solid rgba(190,46,23,.24);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:5px\">\n      <div style=\"font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--hua-red)\">14 fell<\u002Fdiv>\n      <div style=\"font-size:13.5px;line-height:1.5;color:#7A2412\">Dropped a circle or more. Ananda ($25K–$49,999) emptied out from five donors to one.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"midlevel\" data-screen-label=\"Mid-level\" style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;flex-direction:column;gap:10px;max-width:64ch\">\n    <div style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--hua-orange)\">04 — The mid-level plateau<\u002Fdiv>\n    <h2 style=\"margin:0;font-family:'Caprasimo',Georgia,serif;font-weight:400;font-size:38px;line-height:1.1;letter-spacing:-.01em;color:var(--hua-ink)\">$1,000 to $25,000: two more donors, six hundred fewer dollars<\u002Fh2>\n    <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--hua-ink-2)\">This is the band that becomes tomorrow's major gifts. It did not move. Below is FY25 against FY26 by circle, in dollars.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px\">\n    <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:20px;padding:28px 30px;display:flex;flex-direction:column;gap:18px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\">\n        <div style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--hua-ink-3)\">Dollars by circle<\u002Fdiv>\n        <div style=\"display:flex;gap:16px;align-items:center\">\n          <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:11px;height:11px;border-radius:3px;background:#D9C6A4\"><\u002Fspan><span style=\"font-size:12px;font-weight:700;color:var(--hua-ink-2)\">FY25<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:11px;height:11px;border-radius:3px;background:#E4571E\"><\u002Fspan><span style=\"font-size:12px;font-weight:700;color:var(--hua-ink-2)\">FY26<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:15px\">\n        <sc-for list=\"{{ bandBars }}\" as=\"b\" hint-placeholder-count=\"8\">\n          <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center\">\n            <div style=\"display:flex;flex-direction:column;gap:1px\">\n              <div style=\"font-size:13.5px;font-weight:800;color:var(--hua-ink)\">{{ b.name }}<\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:600;color:var(--hua-ink-3)\">{{ b.range }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <div style=\"display:flex;align-items:center;gap:9px\">\n                <div style=\"height:13px;border-radius:4px;background:#D9C6A4;width:{{ b.w25 }}%;min-width:2px\"><\u002Fdiv>\n                <div style=\"font-size:11.5px;font-weight:700;color:var(--hua-ink-3);white-space:nowrap\">{{ b.a }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:9px\">\n                <div style=\"height:13px;border-radius:4px;background:#E4571E;width:{{ b.w26 }}%;min-width:2px\"><\u002Fdiv>\n                <div style=\"font-size:11.5px;font-weight:800;color:var(--hua-ink);white-space:nowrap\">{{ b.b }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:18px;padding:24px 26px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--hua-ink-3)\">Mid-level band, $1K–$25K<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px\">\n          <div style=\"display:flex;flex-direction:column;gap:3px\">\n            <div style=\"font-size:12px;font-weight:700;color:var(--hua-ink-3)\">FY25<\u002Fdiv>\n            <div style=\"font-size:23px;font-weight:800;letter-spacing:-.03em;color:var(--hua-ink)\">$306,925<\u002Fdiv>\n            <div style=\"font-size:12.5px;font-weight:600;color:var(--hua-ink-2)\">56 donors<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px\">\n            <div style=\"font-size:12px;font-weight:700;color:var(--hua-ink-3)\">FY26<\u002Fdiv>\n            <div style=\"font-size:23px;font-weight:800;letter-spacing:-.03em;color:var(--hua-ink)\">$306,299<\u002Fdiv>\n            <div style=\"font-size:12.5px;font-weight:600;color:var(--hua-ink-2)\">58 donors<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding-top:14px;border-top:1px solid var(--hua-line-2);font-size:13.5px;line-height:1.55;color:var(--hua-ink-2)\">Average gift in the band fell from $5,481 to $5,281. More people, smaller cheques — the classic signature of a base that renews itself but is never asked to step up.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:18px;padding:24px 26px;display:flex;flex-direction:column;gap:13px\">\n        <div style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--hua-ink-3)\">Closest to the next circle<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.5;color:var(--hua-ink-2);margin:0\">Ten donors sitting within reach of a threshold. Naming the circle in the ask is usually enough.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:0\">\n          <sc-for list=\"{{ nearMiss }}\" as=\"n\" hint-placeholder-count=\"10\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 78px 96px;gap:10px;padding:8px 0;border-top:1px solid var(--hua-line-2);align-items:center\">\n              <div style=\"font-size:13.5px;font-weight:700;color:var(--hua-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ n.name }}<\u002Fdiv>\n              <div style=\"text-align:right;font-size:13px;font-weight:600;color:var(--hua-ink-2)\">{{ n.now }}<\u002Fdiv>\n              <div style=\"text-align:right;font-size:12.5px;font-weight:800;color:var(--hua-orange)\">{{ n.need }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"downgrades\" data-screen-label=\"Downgrades\" style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;flex-direction:column;gap:10px;max-width:64ch\">\n    <div style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--hua-orange)\">05 — Downgrade register<\u002Fdiv>\n    <h2 style=\"margin:0;font-family:'Caprasimo',Georgia,serif;font-weight:400;font-size:38px;line-height:1.1;letter-spacing:-.01em;color:var(--hua-ink)\">Twenty-one donors gave less. That is $207,765.<\u002Fh2>\n    <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--hua-ink-2)\">None of these are lapsed — every one of them still gave. A reduction from a committed donor is a solicitation failure, not a relationship failure, and it is the cheapest money on this page to win back.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:20px;padding:26px 30px 20px\">\n    <div style=\"display:grid;grid-template-columns:30px minmax(0,1.4fr) 104px 104px 108px 62px minmax(0,1.05fr);gap:12px;padding-bottom:10px;border-bottom:1px solid var(--hua-line);font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--hua-ink-3)\">\n      <div>#<\u002Fdiv><div>Donor<\u002Fdiv><div style=\"text-align:right\">FY25<\u002Fdiv><div style=\"text-align:right\">FY26<\u002Fdiv><div style=\"text-align:right\">Change<\u002Fdiv><div style=\"text-align:right\">%<\u002Fdiv><div>Read<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ decliners }}\" as=\"d\" hint-placeholder-count=\"21\">\n      <div style=\"display:grid;grid-template-columns:30px minmax(0,1.4fr) 104px 104px 108px 62px minmax(0,1.05fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--hua-line-2);align-items:center\" style-hover=\"background:rgba(242,168,29,.07)\">\n        <div style=\"font-size:12px;font-weight:700;color:var(--hua-ink-3)\">{{ d.rank }}<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:1px;min-width:0\">\n          <div style=\"font-size:14px;font-weight:700;color:var(--hua-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ d.name }}<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--hua-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ d.meta }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:right;font-size:13.5px;font-weight:600;color:var(--hua-ink-2)\">{{ d.fy25f }}<\u002Fdiv>\n        <div style=\"text-align:right;font-size:13.5px;font-weight:800;color:var(--hua-ink)\">{{ d.fy26f }}<\u002Fdiv>\n        <div style=\"text-align:right;font-size:13px;font-weight:800;color:var(--hua-red)\">{{ d.deltaf }}<\u002Fdiv>\n        <div style=\"text-align:right;font-size:12.5px;font-weight:700;color:var(--hua-ink-3)\">{{ d.pct }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.45;color:var(--hua-ink-2)\">{{ d.note }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"display:grid;grid-template-columns:30px minmax(0,1.4fr) 104px 104px 108px 62px minmax(0,1.05fr);gap:12px;padding:14px 0 4px;border-top:2px solid var(--hua-ink);align-items:center\">\n      <div><\u002Fdiv>\n      <div style=\"font-size:13.5px;font-weight:800;color:var(--hua-ink)\">All 21 donors<\u002Fdiv>\n      <div style=\"text-align:right;font-size:13.5px;font-weight:700;color:var(--hua-ink-2)\">$670,649<\u002Fdiv>\n      <div style=\"text-align:right;font-size:13.5px;font-weight:800;color:var(--hua-ink)\">$462,884<\u002Fdiv>\n      <div style=\"text-align:right;font-size:13.5px;font-weight:800;color:var(--hua-red)\">−$207,765<\u002Fdiv>\n      <div style=\"text-align:right;font-size:12.5px;font-weight:800;color:var(--hua-ink-3)\">−31%<\u002Fdiv>\n      <div style=\"font-size:12.5px;line-height:1.45;color:var(--hua-ink-2)\">The top eight are 89% of the loss. Rows 20–21 are rounding, not decisions.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"hygiene\" data-screen-label=\"Data hygiene\" style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;flex-direction:column;gap:10px;max-width:64ch\">\n    <div style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--hua-orange)\">06 — Data hygiene<\u002Fdiv>\n    <h2 style=\"margin:0;font-family:'Caprasimo',Georgia,serif;font-weight:400;font-size:38px;line-height:1.1;letter-spacing:-.01em;color:var(--hua-ink)\">Recognition data reconciles<\u002Fh2>\n    <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--hua-ink-2)\">All 150 fiscal-year records — 75 donors across two years — now match the thresholds published at hua.edu, with zero contradictions in either year. Three exports ago 24 labels disagreed with their totals and 15 records were blank. The one remaining gap is that nine records still arrive blank and are derived here rather than stored.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"background:linear-gradient(150deg,#5F7C4C,#41562F);border-radius:20px;padding:30px 32px;color:#fff;display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;opacity:.82\">Circles assigned<\u002Fdiv>\n        <div style=\"font-size:46px;font-weight:800;letter-spacing:-.035em;line-height:1\">150 of 150<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:700;opacity:.92\">{{ blanksLabel }} · $1,076,001 of Tier-1 giving now visible<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:18px;padding:24px 26px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--hua-ink-3)\">Where the circle field stands — all clear<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:13px\">\n          <div style=\"display:flex;flex-direction:column;gap:3px\">\n            <div style=\"font-size:14.5px;font-weight:800;color:var(--hua-sage)\">✓ Tier 1 exists and is applied<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">Kasthuri is a Kautilya Pathfinder; Sajjan Agarwal, Braham Ratan Aggarwal, Rathi, Jahagirdar, Deshpande, Koppula and Nitturkar are Sushruta Patrons. In FY25, Agarwal and Aggarwal were Pathfinders and Rathi a Patron.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px\">\n            <div style=\"font-size:14.5px;font-weight:800;color:var(--hua-sage)\">✓ FY25 re-derived; 9 blanks derived here<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">Twenty-two FY25 labels were corrected in the CRM. Seven FY25 records ($555,339 — including both $250,000 lead gifts and Rathi’s $50,000) and two FY26 records ($15,339) still arrive blank; this analysis derives them by threshold, but the CRM does not yet hold them.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px\">\n            <div style=\"font-size:14.5px;font-weight:800;color:var(--hua-sage)\">✓ Zero contradictions in either year<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">Saraiya’s FY25 $1,000 and Hasmukh Shah’s FY26 $1,500 are both Mitra now. Every one of the 150 records agrees with the published thresholds — the column can be trusted for lifetime recognition.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:20px;padding:26px 30px 20px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"display:flex;flex-direction:column;gap:5px\">\n        <div style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--hua-ink-3)\">Threshold reconciliation<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.5;color:var(--hua-ink-3)\">Recomputed from the export on every load. If a label ever drifts from its total again, it appears here.<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ auditEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:12px;padding:26px 0 18px;align-items:flex-start\">\n          <div style=\"display:flex;align-items:center;gap:14px\">\n            <div style=\"width:42px;height:42px;border-radius:999px;background:rgba(95,124,76,.16);border:1px solid rgba(95,124,76,.4);display:grid;place-items:center;font-size:20px;font-weight:800;color:var(--hua-sage)\">✓<\u002Fdiv>\n            <div style=\"font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--hua-ink)\">Nothing to re-derive<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.55;color:var(--hua-ink-2);max-width:52ch\">Every one of the 150 fiscal-year records sits in the circle its own total calls for. Down from 24 mismatches and 15 blanks across the last three exports.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ auditAny }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 62px 104px 112px 106px;gap:10px;padding-bottom:9px;border-bottom:1px solid var(--hua-line);font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--hua-ink-3)\">\n          <div>Donor<\u002Fdiv><div>Year<\u002Fdiv><div style=\"text-align:right\">Total<\u002Fdiv><div style=\"text-align:right\">Recorded<\u002Fdiv><div style=\"text-align:right\">Should be<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-for list=\"{{ unassigned }}\" as=\"u\" hint-placeholder-count=\"14\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 62px 104px 112px 106px;gap:10px;padding:7px 0;border-bottom:1px solid var(--hua-line-2);align-items:center\">\n          <div style=\"font-size:13px;font-weight:700;color:var(--hua-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ u.name }}<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:700;color:var(--hua-ink-3)\">{{ u.yr }}<\u002Fdiv>\n          <div style=\"text-align:right;font-size:13px;font-weight:800;color:var(--hua-ink)\">{{ u.amt }}<\u002Fdiv>\n          <div style=\"text-align:right;font-size:12.5px;font-weight:700;color:var(--hua-red);text-decoration:line-through\">{{ u.labeled }}<\u002Fdiv>\n          <div style=\"text-align:right;font-size:12.5px;font-weight:800;color:var(--hua-sage)\">{{ u.should }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"padding-top:10px;font-size:12.5px;font-weight:700;color:var(--hua-ink-3)\">{{ auditCount }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"geography\" data-screen-label=\"Geography\" style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;flex-direction:column;gap:10px;max-width:64ch\">\n    <div style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--hua-orange)\">07 — Geography<\u002Fdiv>\n    <h2 style=\"margin:0;font-family:'Caprasimo',Georgia,serif;font-weight:400;font-size:38px;line-height:1.1;letter-spacing:-.01em;color:var(--hua-ink)\">Florida is the base; California is the untapped one<\u002Fh2>\n    <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--hua-ink-2)\">California has the most donors of any state and produces less per donor than anywhere except Texas. Washington's leap is one household, not a market.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:20px;padding:28px 32px 24px;display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:grid;grid-template-columns:64px minmax(0,1fr) 118px 78px 108px;gap:14px;padding-bottom:10px;border-bottom:1px solid var(--hua-line);font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--hua-ink-3)\">\n      <div>State<\u002Fdiv><div>FY26 dollars<\u002Fdiv><div style=\"text-align:right\">FY26<\u002Fdiv><div style=\"text-align:right\">Donors<\u002Fdiv><div style=\"text-align:right\">Per donor<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ geo }}\" as=\"g\" hint-placeholder-count=\"10\">\n      <div style=\"display:grid;grid-template-columns:64px minmax(0,1fr) 118px 78px 108px;gap:14px;align-items:center;padding:6px 0\">\n        <div style=\"font-size:15px;font-weight:800;color:var(--hua-ink)\">{{ g.state }}<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <div style=\"height:16px;border-radius:5px;background:{{ g.fill }};width:{{ g.w }}%;min-width:3px\"><\u002Fdiv>\n          <div style=\"font-size:11.5px;font-weight:700;color:var(--hua-ink-3);white-space:nowrap\">{{ g.trend }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:right;font-size:14px;font-weight:800;color:var(--hua-ink)\">{{ g.b }}<\u002Fdiv>\n        <div style=\"text-align:right;font-size:13.5px;font-weight:600;color:var(--hua-ink-2)\">{{ g.n }}<\u002Fdiv>\n        <div style=\"text-align:right;font-size:13.5px;font-weight:700;color:var(--hua-ink-2)\">{{ g.per }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px\">\n    <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:5px\">\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--hua-ink-3)\">California<\u002Fdiv>\n      <div style=\"font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--hua-ink)\">18 donors · $10,942 each<\u002Fdiv>\n      <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">The largest community in the file and the lowest yield per household among the big three. A West Coast Saṃvāda gathering is the obvious first move.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:5px\">\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--hua-ink-3)\">Texas<\u002Fdiv>\n      <div style=\"font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--hua-ink)\">10 donors · $4,580 each<\u002Fdiv>\n      <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">Ten households, essentially flat year on year, and no gift above $15,000. Houston hosted a Saṃvāda in FY26 — the follow-up asks did not land.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:5px\">\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--hua-ink-3)\">Florida<\u002Fdiv>\n      <div style=\"font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--hua-ink)\">13 donors · $29,198 each<\u002Fdiv>\n      <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">The home market performs as a home market should. It is the proof that proximity plus programming converts — and the template for the other three.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"register\" data-screen-label=\"Donor register\" style=\"display:flex;flex-direction:column;gap:22px\">\n  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap\">\n    <div style=\"display:flex;flex-direction:column;gap:10px;max-width:60ch\">\n      <div style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--hua-orange)\">08 — Donor register<\u002Fdiv>\n      <h2 style=\"margin:0;font-family:'Caprasimo',Georgia,serif;font-weight:400;font-size:38px;line-height:1.1;letter-spacing:-.01em;color:var(--hua-ink)\">All 75 donors<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n      <input type=\"search\" value=\"{{ q }}\" sc-camel-on-input=\"{{ onSearch }}\" placeholder=\"Search name or state…\" style=\"font-size:13.5px;font-weight:600;color:var(--hua-ink);padding:9px 16px;border-radius:999px;border:1px solid var(--hua-line);background:var(--hua-surface);outline:none;min-width:230px\" style-focus=\"border-color:var(--hua-orange);box-shadow:0 0 0 3px rgba(228,87,30,.14)\">\n      <div style=\"display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--hua-cream-2);border:1px solid var(--hua-line)\">\n        <button sc-camel-on-click=\"{{ mvAll }}\" style=\"{{ mvAllStyle }}\">All<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ mvUp }}\" style=\"{{ mvUpStyle }}\">Increased<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ mvFlat }}\" style=\"{{ mvFlatStyle }}\">Flat<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ mvDown }}\" style=\"{{ mvDownStyle }}\">Decreased<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:20px;padding:22px 28px 16px\">\n    <div style=\"display:grid;grid-template-columns:minmax(0,1.5fr) 54px 108px 108px 116px 116px 104px;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--hua-line)\">\n      <button sc-camel-on-click=\"{{ sortName }}\" style=\"{{ thName }}\">Donor<\u002Fbutton>\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--hua-ink-3)\">St.<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ sortFy25 }}\" style=\"{{ thFy25 }}\">FY25<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ sortFy26 }}\" style=\"{{ thFy26 }}\">FY26<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ sortDelta }}\" style=\"{{ thDelta }}\">Change<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ sortAll }}\" style=\"{{ thAll }}\">Lifetime<\u002Fbutton>\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--hua-ink-3);text-align:right\">Last gift<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ tableRows }}\" as=\"r\" hint-placeholder-count=\"18\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.5fr) 54px 108px 108px 116px 116px 104px;gap:12px;padding:9px 0;border-bottom:1px solid var(--hua-line-2);align-items:center\" style-hover=\"background:rgba(242,168,29,.07)\">\n        <div style=\"display:flex;align-items:center;gap:10px;min-width:0\">\n          <div style=\"width:7px;height:7px;border-radius:999px;flex:none;background:{{ r.dot }}\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:0;min-width:0\">\n            <div style=\"font-size:13.5px;font-weight:700;color:var(--hua-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.name }}<\u002Fdiv>\n            <div style=\"font-size:11px;color:var(--hua-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.org }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:700;color:var(--hua-ink-3)\">{{ r.state }}<\u002Fdiv>\n        <div style=\"text-align:right;font-size:13px;font-weight:600;color:var(--hua-ink-2)\">{{ r.fy25f }}<\u002Fdiv>\n        <div style=\"text-align:right;font-size:13px;font-weight:800;color:var(--hua-ink)\">{{ r.fy26f }}<\u002Fdiv>\n        <div style=\"text-align:right;font-size:12.5px;font-weight:800;color:{{ r.deltaColor }}\">{{ r.deltaf }}<\u002Fdiv>\n        <div style=\"text-align:right;font-size:12.5px;font-weight:600;color:var(--hua-ink-2)\">{{ r.allf }}<\u002Fdiv>\n        <div style=\"text-align:right;font-size:12px;font-weight:600;color:var(--hua-ink-3)\">{{ r.last }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"padding-top:12px;font-size:12.5px;font-weight:600;color:var(--hua-ink-3)\">{{ tableCount }}<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"path\" data-screen-label=\"Path to 3.5M\" style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;flex-direction:column;gap:10px;max-width:64ch\">\n    <div style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--hua-orange)\">09 — Path to the goal<\u002Fdiv>\n    <h2 style=\"margin:0;font-family:'Caprasimo',Georgia,serif;font-weight:400;font-size:38px;line-height:1.1;letter-spacing:-.01em;color:var(--hua-ink)\">Building FY 2026·27 from this base<\u002Fh2>\n    <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--hua-ink-2)\">Seven levers, each one grounded in a number from this file. Move the sliders to see what a realistic FY27 looks like — and how much of the $3.5M target has to come from donors who are not in this cohort at all.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:20px;align-items:start\">\n    <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:20px;padding:28px 30px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--hua-ink-3)\">Assumptions<\u002Fdiv>\n      <sc-for list=\"{{ levers }}\" as=\"l\" hint-placeholder-count=\"7\">\n        <div style=\"display:flex;flex-direction:column;gap:7px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px\">\n            <div style=\"font-size:14px;font-weight:800;color:var(--hua-ink)\">{{ l.label }}<\u002Fdiv>\n            <div style=\"font-size:13px;font-weight:800;color:var(--hua-orange);white-space:nowrap\">{{ l.valueLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <input type=\"range\" min=\"{{ l.min }}\" max=\"{{ l.max }}\" step=\"{{ l.step }}\" value=\"{{ l.value }}\" sc-camel-on-input=\"{{ l.onInput }}\">\n          <div style=\"font-size:12px;line-height:1.45;color:var(--hua-ink-3)\">{{ l.help }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <button sc-camel-on-click=\"{{ resetLevers }}\" style=\"align-self:flex-start;font-size:12.5px;font-weight:800;color:var(--hua-ink-2);background:var(--hua-cream-2);border:1px solid var(--hua-line);border-radius:999px;padding:8px 16px;cursor:pointer\" style-hover=\"background:rgba(228,87,30,.10);color:var(--hua-orange);border-color:rgba(228,87,30,.28)\">Reset to base case<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:20px;padding:28px 30px;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px\">\n          <div style=\"display:flex;flex-direction:column;gap:3px\">\n            <div style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--hua-ink-3)\">Modelled FY 2026·27<\u002Fdiv>\n            <div style=\"font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1;color:var(--hua-orange)\">{{ modelTotalf }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px;text-align:right\">\n            <div style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--hua-ink-3)\">Gap to goal<\u002Fdiv>\n            <div style=\"font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1;color:{{ gapColor }}\">{{ gapf }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:20px;border-radius:999px;background:var(--hua-cream-2);overflow:hidden;display:flex\">\n          <div style=\"height:100%;background:linear-gradient(90deg,#F2A81D,#E4571E);width:{{ goalPct }}%;transition:width .18s ease\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--hua-ink-2)\">\n          <div>{{ goalPctLabel }} of the {{ goalLabel }} target<\u002Fdiv>\n          <div>{{ goalLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-radius:20px;padding:24px 30px 18px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--hua-ink-3)\">Contribution by lever<\u002Fdiv>\n        <sc-for list=\"{{ contributions }}\" as=\"c\" hint-placeholder-count=\"8\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--hua-line-2)\">\n            <div style=\"display:flex;align-items:center;gap:10px;min-width:0\">\n              <div style=\"width:9px;height:9px;border-radius:2px;flex:none;background:{{ c.fill }}\"><\u002Fdiv>\n              <div style=\"font-size:13.5px;font-weight:700;color:var(--hua-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ c.label }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align:right;font-size:13.5px;font-weight:800;color:{{ c.color }}\">{{ c.amt }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"plan\" data-screen-label=\"Action plan\" style=\"display:flex;flex-direction:column;gap:28px\">\n  <div style=\"display:flex;flex-direction:column;gap:10px;max-width:64ch\">\n    <div style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--hua-orange)\">10 — Action plan<\u002Fdiv>\n    <h2 style=\"margin:0;font-family:'Caprasimo',Georgia,serif;font-weight:400;font-size:38px;line-height:1.1;letter-spacing:-.01em;color:var(--hua-ink)\">Ninety days, then a year<\u002Fh2>\n    <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--hua-ink-2)\">The first quarter is repair work — nothing here needs new budget. The remaining three quarters build the pipeline that FY26 did not.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:flex;align-items:center;gap:14px\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--hua-orange);white-space:nowrap\">First 90 days<\u002Fdiv>\n      <div style=\"height:1px;flex:1;background:var(--hua-line)\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px\">\n      <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-top:3px solid var(--hua-orange);border-radius:16px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:9px\">\n        <div style=\"font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--hua-ink-3)\">Weeks 1–2<\u002Fdiv>\n        <div style=\"font-size:16px;font-weight:800;line-height:1.25;color:var(--hua-ink)\">Lock the circle field<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.52;color:var(--hua-ink-2)\">Labels reconcile in both years. One step left: write the nine derived blanks back into the CRM, then lock the field to a calculated rule so it cannot drift again.<\u002Fdiv>\n        <div style=\"margin-top:auto;padding-top:10px;font-size:12px;font-weight:800;color:var(--hua-orange)\">Owner: Advancement ops<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-top:3px solid var(--hua-orange);border-radius:16px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:9px\">\n        <div style=\"font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--hua-ink-3)\">Weeks 2–6<\u002Fdiv>\n        <div style=\"font-size:16px;font-weight:800;line-height:1.25;color:var(--hua-ink)\">President's calls to the top eight<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.52;color:var(--hua-ink-2)\">Eight households give $1,076,001 and are now correctly recorded as Patrons and Pathfinders. Thank-you calls first, no ask; the listing is the reason for the call.<\u002Fdiv>\n        <div style=\"margin-top:auto;padding-top:10px;font-size:12px;font-weight:800;color:var(--hua-orange)\">Owner: President<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-top:3px solid var(--hua-orange);border-radius:16px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:9px\">\n        <div style=\"font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--hua-ink-3)\">Weeks 3–10<\u002Fdiv>\n        <div style=\"font-size:16px;font-weight:800;line-height:1.25;color:var(--hua-ink)\">Work the downgrade register<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.52;color:var(--hua-ink-2)\">Twenty-one conversations, $207,765 at stake. Start with the two $50,000 reductions and the four donors who cut by more than $10,000. Ask what changed before asking for anything.<\u002Fdiv>\n        <div style=\"margin-top:auto;padding-top:10px;font-size:12px;font-weight:800;color:var(--hua-orange)\">Owner: Director of Advancement<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--hua-surface);border:1px solid var(--hua-line);border-top:3px solid var(--hua-orange);border-radius:16px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:9px\">\n        <div style=\"font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--hua-ink-3)\">Weeks 6–12<\u002Fdiv>\n        <div style=\"font-size:16px;font-weight:800;line-height:1.25;color:var(--hua-ink)\">Turn on match and DAF capture<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.52;color:var(--hua-ink-2)\">Benevity and Cybergrant already appear in the file, and there is a Google employee in the cohort. Put a match lookup on the give page and a DAF widget beside it.<\u002Fdiv>\n        <div style=\"margin-top:auto;padding-top:10px;font-size:12px;font-weight:800;color:var(--hua-orange)\">Owner: Advancement + Web<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:flex;align-items:center;gap:14px\">\n      <div style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--hua-orange);white-space:nowrap\">Twelve months<\u002Fdiv>\n      <div style=\"height:1px;flex:1;background:var(--hua-line)\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px\">\n      <div style=\"background:var(--hua-cream-2);border:1px solid var(--hua-line);border-radius:16px;padding:24px 24px 22px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <div style=\"width:28px;height:28px;border-radius:999px;background:var(--hua-ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800\">Q1<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:800;color:var(--hua-ink)\">Fix and thank<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">FY25 circles back-filled and the field locked to a rule.<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">Recognition published for all 8 Tier-1 donors.<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">Downgrade conversations complete; reasons logged.<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">Match and DAF tools live on hua.edu/give.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:auto;padding-top:12px;border-top:1px solid var(--hua-line);font-size:12.5px;font-weight:800;color:var(--hua-orange)\">Target: $100K recovered from lead gifts<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--hua-cream-2);border:1px solid var(--hua-line);border-radius:16px;padding:24px 24px 22px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <div style=\"width:28px;height:28px;border-radius:999px;background:var(--hua-ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800\">Q2<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:800;color:var(--hua-ink)\">Launch the monthly programme<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">Seva, Mitra and Shraddha rebuilt as a monthly ladder — the recognition page already frames Tier 3 that way.<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">Recurring ask added to every webinar registration and course confirmation.<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">Convert the 38 donors currently giving $500–$2,499 in one annual cheque.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:auto;padding-top:12px;border-top:1px solid var(--hua-line);font-size:12.5px;font-weight:800;color:var(--hua-orange)\">Target: 60 sustainers at $250/month<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--hua-cream-2);border:1px solid var(--hua-line);border-radius:16px;padding:24px 24px 22px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <div style=\"width:28px;height:28px;border-radius:999px;background:var(--hua-ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800\">Q3<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:800;color:var(--hua-ink)\">Move the middle<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">Named portfolio of 58 mid-level donors, each assigned to a caller with a specific circle to move into.<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">Regional Saṃvāda gatherings in California and Texas — the two states with donors but no yield.<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">Fund-specific asks: Sustenance, Capital and Endowment rather than an undesignated appeal.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:auto;padding-top:12px;border-top:1px solid var(--hua-line);font-size:12.5px;font-weight:800;color:var(--hua-orange)\">Target: 25 donors up one circle<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--hua-cream-2);border:1px solid var(--hua-line);border-radius:16px;padding:24px 24px 22px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <div style=\"width:28px;height:28px;border-radius:999px;background:var(--hua-ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800\">Q4<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:800;color:var(--hua-ink)\">Reduce the dependency<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">Four new Sushruta-level relationships cultivated to a first $50,000 gift.<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">Multi-year pledges from the top eight so FY28 does not restart from zero.<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.5;color:var(--hua-ink-2)\">Board-level concentration metric reported quarterly, with a stated ceiling.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:auto;padding-top:12px;border-top:1px solid var(--hua-line);font-size:12.5px;font-weight:800;color:var(--hua-orange)\">Target: top-10 share below 70%<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--hua-ink);border-radius:20px;padding:36px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:40px;align-items:center\">\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--hua-gold)\">The single metric<\u002Fdiv>\n      <div style=\"font-family:'Caprasimo',Georgia,serif;font-weight:400;font-size:34px;line-height:1.12;color:#fff\">Giving excluding the top ten<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <p style=\"margin:0;font-size:16px;line-height:1.62;color:rgba(255,255,255,.80)\">Total receipts will keep telling a flattering story as long as a handful of extraordinary donors keep saying yes. The number that tells you whether the institution is actually building a base is what everyone else gives. In FY26 that number went backwards.<\u002Fp>\n      <div style=\"display:flex;gap:34px;padding-top:6px\">\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <div style=\"font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.5)\">FY25<\u002Fdiv>\n          <div style=\"font-size:26px;font-weight:800;letter-spacing:-.03em;color:#fff\">$323,906<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <div style=\"font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.5)\">FY26<\u002Fdiv>\n          <div style=\"font-size:26px;font-weight:800;letter-spacing:-.03em;color:#fff\">$289,313<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <div style=\"font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.5)\">FY27 target<\u002Fdiv>\n          <div style=\"font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--hua-gold)\">$450,000<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top:1px solid var(--hua-line);padding-top:26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n  <img src=\"6b4d6439-3f71-4211-9790-2e72b905459d\" alt=\"\" style=\"width:38px;height:38px;opacity:.85\">\n  <div style=\"display:flex;flex-direction:column;gap:10px;max-width:88ch\">\n    <div style=\"font-size:12.5px;line-height:1.5;color:var(--hua-ink-3)\">Prepared for the Office of the President from the FY25/FY26 donor export. Cohort: 75 donors with $500 or more in both fiscal years. Circle thresholds per hua.edu donor recognition. FY27 modelling is illustrative and applies only to this cohort.<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--hua-ink-2)\">\n      <span>Data owned by Hindu University of America<\u002Fspan>\n      <span style=\"color:var(--hua-line)\">·<\u002Fspan>\n      <span>Design by Accoance Technologies Private Limited<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;fyGoal&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3500000,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:500000,&quot;max&quot;:10000000,&quot;step&quot;:100000,&quot;section&quot;:&quot;Model&quot;,&quot;unit&quot;:&quot;$&quot;},&quot;showDonorNames&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&q on small annual gifts. Ask for a circle, not an amount.',\n      'Gaurang Vaishnav':'Halved to $1,001. Holding Mitra but at the floor.',\n      'Shruti Pant':'Down 44%. Mitra both years \\u2014 low effort to restore.',\n      'Hasmukh Shah':'Email blocked Dec 2025. Reach by phone, not appeal.',\n      'Dinesh & Daksha Shah':'$1,001 \\u2192 $501. Looks like one instalment of two.',\n      'Choudhary Balwan Singh Patel':'Effectively flat at the Seva floor. No action needed.',\n      'Irvine Hindu Mandir':'$1 lower. Institutional donor \\u2014 treat as renewed.'\n    };\n    const decliners=[...downs].sort((a,b)=>a.delta-b.delta).map((r,i)=>({\n      rank:String(i+1).padStart(2,'0'),\n      name:r.name,meta:[r.state,r.org].filter(Boolean).join(' \\u00b7 ')||'\\u2014',\n      fy25f:m(r.fy25),fy26f:m(r.fy26),deltaf:'\\u2212'+m(Math.abs(r.delta)).replace('\\u2212',''),\n      pct:(p=>p<0.5?'<1%':'\\u2212'+p.toFixed(0)+'%')(Math.abs(r.delta)/r.fy25*100),\n      note:notes[r.raw]||'Down a circle. Worth a call before the FY27 appeal.'}));\n\n    // ---- label audit: every record now has a circle; these contradict the thresholds ----\n    const short=n=>n.split(' ')[0];\n    const audit=[];\n    for(const r of rows){\n      const o26=tierOf(r.fy26),o25=tierOf(r.fy25);\n      if(r.crm!=='Unassigned'&&o26&&r.crm!==o26.name)audit.push({name:r.name,yr:'FY26',amt:m(r.fy26),labeled:short(r.crm),should:short(o26.name),v:r.fy26});\n      if(r.crm25!=='Unassigned'&&o25&&r.crm25!==o25.name)audit.push({name:r.name,yr:'FY25',amt:m(r.fy25),labeled:short(r.crm25),should:short(o25.name),v:r.fy25});\n    }\n    audit.sort((a,b)=>b.v-a.v);\n    const unassigned=audit.slice(0,14);\n    const auditCount=audit.length;\n    const blanks=rows.filter(r=>r.crm==='Unassigned').length+rows.filter(r=>r.crm25==='Unassigned').length;\n\n    // ---- geography ----\n    const gmap={};\n    for(const r of rows){const k=r.state||'\\u2014';gmap[k]=gmap[k]||{n:0,a:0,b:0};gmap[k].n++;gmap[k].a+=r.fy25;gmap[k].b+=r.fy26;}\n    const glist=Object.entries(gmap).sort((x,y)=>y[1].b-x[1].b).slice(0,10);\n    const gmax=glist[0]?glist[0][1].b:1;\n    const geo=glist.map(([k,v])=>{\n      const ch=v.a>0?(v.b/v.a-1)*100:0;\n      return {state:k,b:m(v.b),n:String(v.n),per:m(v.b/v.n),w:(v.b/gmax*100).toFixed(1),\n        fill:ch>=0?'linear-gradient(90deg,#F2A81D,#E4571E)':'#D9C6A4',\n        trend:(ch>=0?'+':'\\u2212')+Math.abs(ch).toFixed(0)+'% YoY'};\n    });\n\n    // ---- register ----\n    const q=S.q.trim().toLowerCase();\n    let tr=rows.filter(r=>!q||r.name.toLowerCase().indexOf(q)>=0||(r.org||'').toLowerCase().indexOf(q)>=0||r.state.toLowerCase().indexOf(q)>=0);\n    if(S.mv!=='all')tr=tr.filter(r=>r.mv===S.mv);\n    const k=S.sortKey,dir=S.sortDir;\n    tr=[...tr].sort((a,b)=>k==='name'?dir*a.name.localeCompare(b.name):dir*(a[k]-b[k]));\n    const tableRows=tr.map(r=>({name:r.name,org:r.org||'',state:r.state,\n      fy25f:m(r.fy25),fy26f:m(r.fy26),allf:m(r.all),last:r.last||'\\u2014',\n      deltaf:(r.mv==='up'?'+':r.mv==='down'?'\\u2212':'\\u00b1')+m(Math.abs(r.delta)).replace('\\u2212',''),\n      deltaColor:r.mv==='up'?'#5F7C4C':r.mv==='down'?'#BE2E17':'#9C8B79',\n      dot:r.mv==='up'?'#5F7C4C':r.mv==='down'?'#BE2E17':'#D9C6A4'}));\n\n    // ---- scenario ----\n    const renewed=t26*S.renew/100;\n    const leadRec=S.lead/100*100000;\n    const recovered=Math.abs(downTotal)*S.recov/100;\n    const midUp=S.midN*7500;\n    const match=t26*S.matchPct/100;\n    const majors=S.majors*50000;\n    const monthly=S.monN*250*12;\n    const modelTotal=renewed+leadRec+recovered+midUp+match+majors+monthly;\n    const gap=GOAL-modelTotal;\n    const contributions=[\n      {label:'FY26 base renewed at '+S.renew+'%',amt:m(renewed),fill:'#241C17',color:'#241C17'},\n      {label:'Lead gifts restored to $250K',amt:'+'+m(leadRec),fill:'#BE2E17',color:'#5F7C4C'},\n      {label:'Downgrades recovered ('+S.recov+'%)',amt:'+'+m(recovered),fill:'#E4571E',color:'#5F7C4C'},\n      {label:S.midN+' mid-level donors up one circle',amt:'+'+m(midUp),fill:'#ED7B22',color:'#5F7C4C'},\n      {label:'Employer match & DAF capture',amt:'+'+m(match),fill:'#F2A81D',color:'#5F7C4C'},\n      {label:S.majors+' new Sushruta gifts at $50K',amt:'+'+m(majors),fill:'#C9A94A',color:'#5F7C4C'},\n      {label:S.monN+' sustainers at $250/month',amt:'+'+m(monthly),fill:'#5F7C4C',color:'#5F7C4C'}\n    ];\n    const mkLever=(key,label,min,max,step,vl,help)=>({label:label,min:min,max:max,step:step,value:S[key],valueLabel:vl,help:help,\n      onInput:e=>this.setState({[key]:Number(e.target.value)})});\n    const levers=[\n      mkLever('renew','Renewal of the FY26 base',70,100,1,S.renew+'%','Every donor in this file gives again at this share of their FY26 amount.'),\n      mkLever('lead','Lead gifts restored',0,100,25,S.lead+'% of $100K','Agarwal and Aggarwal return to $250,000 each.'),\n      mkLever('recov','Downgrades recovered',0,100,5,S.recov+'% of '+m(Math.abs(downTotal)),'Share of the 21 reductions won back through direct conversation.'),\n      mkLever('midN','Mid-level donors moved up',0,58,1,S.midN+' donors','Average step of $7,500 \\u2014 roughly one published circle.'),\n      mkLever('matchPct','Match & DAF uplift',0,30,1,S.matchPct+'% of base','Benevity, Cybergrant and donor-advised funds already appear in the file.'),\n      mkLever('majors','New Sushruta-level gifts',0,12,1,S.majors+' \\u00d7 $50K','First-time $50,000 donors cultivated during the year.'),\n      mkLever('monN','Monthly sustainers',0,150,5,S.monN+' at $250/mo','Tier 3 circles rebuilt as a recurring programme.')\n    ];\n\n    return {\n      t26f:m(t26),\n      waterfall:waterfall,\n      toggleExcl:()=>this.setState({excl:!S.excl}),\n      exclBtnLabel:S.excl?'Showing base without Kasthuri':'Exclude the outlier donor',\n      exclBtnStyle:'font-size:13px;font-weight:800;padding:11px 20px;border-radius:999px;cursor:pointer;white-space:nowrap;'+\n        (S.excl?'background:#E4571E;color:#fff;border:1px solid #E4571E':'background:#fff;color:#6E5D4F;border:1px solid #E7D8BE'),\n      paretoPoints:paretoPoints,paretoArea:paretoArea,top12:top12,\n      tierRows:tierRows,tierNote:tierNote,\n      colA:S.tierMode==='threshold'?'FY25 $':'Integrity',colB:S.tierMode==='threshold'?'Donors':'',\n      colC:S.tierMode==='threshold'?'Change':'Share',\n      setThreshold:()=>this.setState({tierMode:'threshold'}),\n      setCrm:()=>this.setState({tierMode:'crm'}),\n      thresholdBtnStyle:this.pill(S.tierMode==='threshold'),\n      crmBtnStyle:this.pill(S.tierMode==='crm'),\n      bandBars:bandBars,nearMiss:nearMiss,decliners:decliners,unassigned:unassigned,geo:geo,\n      auditCount:auditCount===0?'All 150 records agree with their fiscal-year totals.':auditCount+' records carry a circle that contradicts its own fiscal-year total',\n      auditEmpty:auditCount===0,auditAny:auditCount>0,\n      blanksLabel:'Zero contradictions \\u00b7 9 still blank in the CRM',\n      q:S.q,onSearch:e=>this.setState({q:e.target.value}),\n      mvAll:()=>this.setState({mv:'all'}),mvUp:()=>this.setState({mv:'up'}),\n      mvFlat:()=>this.setState({mv:'flat'}),mvDown:()=>this.setState({mv:'down'}),\n      mvAllStyle:this.pill(S.mv==='all'),mvUpStyle:this.pill(S.mv==='up'),\n      mvFlatStyle:this.pill(S.mv==='flat'),mvDownStyle:this.pill(S.mv==='down'),\n      sortName:()=>this.sortBy('name'),sortFy25:()=>this.sortBy('fy25'),sortFy26:()=>this.sortBy('fy26'),\n      sortDelta:()=>this.sortBy('delta'),sortAll:()=>this.sortBy('all'),\n      thName:this.th('name','Donor','left').style,thFy25:this.th('fy25','FY25','right').style,\n      thFy26:this.th('fy26','FY26','right').style,thDelta:this.th('delta','Change','right').style,\n      thAll:this.th('all','Lifetime','right').style,\n      tableRows:tableRows,tableCount:tableRows.length+' of 75 donors shown \\u00b7 click a column heading to sort',\n      levers:levers,contributions:contributions,\n      modelTotalf:m(modelTotal),gapf:gap>0?m(gap)+' short':m(-gap)+' over',\n      gapColor:gap>0?'#BE2E17':'#5F7C4C',\n      goalPct:Math.min(100,modelTotal/GOAL*100).toFixed(1),\n      goalPctLabel:(modelTotal/GOAL*100).toFixed(0)+'%',\n      goalLabel:'$'+(GOAL/1000000).toFixed(1)+'M',\n      resetLevers:()=>this.setState(Object.assign({},BASE))\n    };\n  }\n\n  sortBy(k){\n    if(this.state.sortKey===k)this.setState({sortDir:-this.state.sortDir});\n    else this.setState({sortKey:k,sortDir:k==='name'?1:-1});\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
